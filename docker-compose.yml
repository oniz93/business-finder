version: '3.8'

services:
  elasticsearch:
    image: elasticsearch:8.19.23
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms768m -Xmx768m"   # 2g heap was sitting swapped out on an 8GB box
    ports:
      - "9200:9200"
    volumes:
      - /mnt/HC_Volume_103745020/es_data:/usr/share/elasticsearch/data
    healthcheck:
      # retries 12 x 15s = 180s tolerance: a shared-volume XFS stall once froze ES
      # for >122s, Swarm killed it (exit 137) and search was down ~2 min.
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 600s
    deploy:
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 3g
  kibana:
    image: kibana:8.19.23
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    deploy:
      replicas: 0   # Kibana is admin UI only (no app code depends on it); stopped to free ~480MB
